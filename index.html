<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Butcher App — Custom Cuts</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="site-header">
    <div class="container">
      <h1>Butcher App — Custom Cuts</h1>
      <p class="tag">Order local, custom-cut meat from nearby butchers</p>
    </div>
  </header>

  <main class="container">
    <section id="catalog">
      <h2>Available Cuts</h2>
      <div id="products" class="products-grid">Loading products...</div>
    </section>

    <aside id="cart" class="cart">
      <h2>Your Order</h2>
      <div id="cart-items" class="cart-items">(empty)</div>
      <div class="cart-footer">
        <div class="total">Total: $<span id="cart-total">0.00</span></div>
        <button id="place-order" class="btn" disabled>Place Order</button>
      </div>
    </aside>
  </main>

  <footer class="site-footer">
    <div class="container">See README.md for development notes.</div>
  </footer>

  <script src="js/app.js" type="module"></script>
</body>
</html>
